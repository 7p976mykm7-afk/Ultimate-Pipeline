groups:
  - name: panmatrix_hardened_operational_rules
    rules:
      # ALERT 1: Systemic Alignment Blindness Risk
      - alert: PanmatrixControlLoopBlinded
        expr: panmatrix_spatial_pearson_r < 0.20
        for: 30s
        labels:
          severity: critical
          tier: telemetry
        annotations:
          summary: "Control loop blindness detected: Spatial correlation dropped below boundary limits."
          description: "Active correlation is currently {{ $value }}. The system is running blind to hidden alignments and is susceptible to a slow cosmic alignment node overload."

      # ALERT 2: Safety Reversal Circuit Breaker Tripped (Dynamic Throttle Activated)
      - alert: PipelinePerformanceDegraded
        expr: panmatrix_degraded_state_active == 1
        for: 10s
        labels:
          severity: warning
          tier: performance
        annotations:
          summary: "Pipeline performance scaled down via automatic reversal safety logic."
          description: "Outbound communication faults passed maximum threshold barriers. Monte Carlo iterations downscaled to 100 runs to preserve local thread space."

      # ALERT 3: Tamper Detection (Cryptographic HMAC Failure)
      - alert: PanmatrixCryptoVerificationFailed
        expr: panmatrix_security_tamper_status == 1
        for: 0s
        labels:
          severity: page
          tier: security
        annotations:
          summary: "Cryptographic telemetry tampering detected: Scrape signature validation failure."
          description: "Incoming scrape request provided an invalid HMAC-SHA256 token. Telemetry registers locked down instantly to protect systemic operational data."

      # ALERT 4: Legal Header Violation (Defensive Brand Scrubbing Block)
      - alert: PanmatrixTrademarkHeaderMissing
        expr: panmatrix_trademark_header_valid == 0
        for: 0s
        labels:
          severity: critical
          tier: compliance
        annotations:
          summary: "Defensive Trademark Header missing or scrubbed by external client."
          description: "Scrape requests rejected due to missing 'X-Panmatrix-Trademark-Rider' confirmation tags. Processing engine in forced safe-isolation mode."
